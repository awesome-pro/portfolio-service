[project]
name = "portfolio-demos-api"
version = "0.1.0"
description = "FastAPI backend for portfolio project demos."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "agenteval-py>=0.1.1",
    "fastapi[standard]>=0.136.3",
    "guardloop[otel]>=0.4.2",
    "litellm>=1.88.0",
    "orchflow[litellm]==0.5.0",
    "pydantic-settings>=2.14.1",
    "smartmemo[ml]>=0.3.0",
    # Declared directly so the [tool.uv.sources] CPU-index override below binds
    # (uv sources only apply to direct deps; torch is otherwise transitive).
    "torch>=2.12.0",
    "uvicorn[standard]>=0.49.0",
]

# Pull torch from PyTorch's CPU-only index. The default PyPI Linux wheel
# depends on the full nvidia-* CUDA stack (several GB), which overflows the
# Railway build. This backend has no GPU, so the CPU build is all we need.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false
